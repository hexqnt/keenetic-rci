name: Publish

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Git tag to verify and publish, for example v0.1.0
        required: true
        type: string

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RELEASE_TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.tag }}
  RUSTFLAGS: -Dwarnings

jobs:
  verify:
    name: Verify crate
    runs-on: ubuntu-latest
    outputs:
      verified_sha: ${{ steps.revision.outputs.sha }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Verify release tag
        shell: bash
        run: |
          package_id="$(cargo pkgid --quiet)"
          manifest_version="${package_id##*#}"
          manifest_version="${manifest_version##*@}"
          expected_tag="v${manifest_version}"
          if [[ "${RELEASE_TAG}" != "${expected_tag}" ]]; then
            echo "Release tag '${RELEASE_TAG}' does not match package version '${manifest_version}'; expected '${expected_tag}'." >&2
            exit 1
          fi

      - name: Capture verified revision
        id: revision
        shell: bash
        run: echo "sha=$(git rev-parse HEAD)" >> "${GITHUB_OUTPUT}"

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy
        run: cargo clippy --all-targets --all-features --locked -- -D warnings

      - name: Run tests
        run: cargo test --all-features --locked

      - name: Check documentation
        run: cargo doc --no-deps --all-features --locked

      - name: Verify crate package
        run: cargo package --locked

  publish:
    name: Publish crate to crates.io
    needs: verify
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.verify.outputs.verified_sha }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Publish keenetic-rci
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish --locked

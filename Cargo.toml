[package]
name = "keenetic-rci"
version = "0.1.2"
edition = "2024"
description = "Unofficial asynchronous Rust client for the Keenetic/Netcraze RCI HTTP API"
license = "MIT OR Apache-2.0"
authors = ["hexqnt <hexqntlab@gmail.com>"]
repository = "https://github.com/hexqnt/keenetic-rci"
documentation = "https://docs.rs/keenetic-rci"
readme = "README.md"
keywords = ["keenetic", "netcraze", "router", "rci", "networking"]
categories = ["api-bindings", "network-programming"]
include = [
    "src/**",
    "tests/**",
    "benches/**",
    "Cargo.toml",
    "README.md",
    "LICENSE*",
    "live.example.toml",
]

[dependencies]
bytes = "1.12.1"
ipnet = { version = "2.12.1", features = ["serde"] }
md-5 = "0.11.0"
memchr = "2.8.3"
percent-encoding = "2.3.2"
reqwest = { version = "0.13.4", features = ["cookies", "json"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
serde_urlencoded = "0.7.1"
sha2 = "0.11.0"
thiserror = "2.0.20"
time = { version = "0.3.55", features = ["macros", "parsing", "serde"] }
tokio = { version = "1.53.1", features = ["sync", "time"] }
zeroize = { version = "1.9.0", features = ["derive"] }

[dev-dependencies]
axum = "0.8.9"
criterion = { version = "0.8.2", default-features = false, features = [
    "async_tokio",
    "cargo_bench_support",
] }
toml = "1.1.4"
tokio = { version = "1.53.1", features = [
    "macros",
    "net",
    "rt-multi-thread",
    "sync",
    "time",
] }

[[bench]]
name = "performance"
harness = false

[profile.bench]
debug = 1

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }
multiple_crate_versions = "allow"
# Work around a rust-clippy 2026-08-23 ICE while it inspects reqwest opaque futures.
large_futures = { level = "allow", priority = 1 }
